name: Format Home refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run Prettier
        run: pnpm exec prettier --write src/home-freshness.js src/home-refresh.js
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/home-freshness.js src/home-refresh.js
          if git diff --cached --quiet; then
            echo "Already formatted."
          else
            git commit -m "style: apply Prettier to Home refresh"
            git push origin HEAD:main
          fi
