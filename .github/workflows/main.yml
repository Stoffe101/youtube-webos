name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm run "/^build|^lint:all/"
      - run: pnpm run test:compat
      - run: pnpm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube_adfree_ipk
          path: |
            ${{github.workspace}}/youtube.leanback.v4_*_all.ipk

      - name: Publish installable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="custom-${GITHUB_RUN_NUMBER}"
          IPK="$(ls youtube.leanback.v4_*_all.ipk | head -n 1)"
          gh release create "$TAG" "$IPK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YouTube AdFree Custom $TAG" \
            --notes "Custom build from commit $GITHUB_SHA. Includes the LG yellow-button Home recommendation refresh." \
            --latest
